<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="meraBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09131C" />
      <stop offset="50%" stop-color="#0F1F2C" />
      <stop offset="100%" stop-color="#0A1622" />
    </linearGradient>

    <!-- Card Shadow -->
    <filter id="mCardShadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.45" />
    </filter>

    <filter id="mGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#2ED8B6" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Dark Atmospheric Backdrop -->
  <rect width="1200" height="600" rx="20" fill="url(#meraBgGrad)" />

  <!-- Subtle Cyan Grid & Radar Glow in background -->
  <g opacity="0.06" stroke="#2ED8B6" stroke-width="1">
    <line x1="0" y1="150" x2="1200" y2="150" />
    <line x1="0" y1="300" x2="1200" y2="300" />
    <line x1="0" y1="450" x2="1200" y2="450" />
    <line x1="300" y1="0" x2="300" y2="600" />
    <line x1="600" y1="0" x2="600" y2="600" />
    <line x1="900" y1="0" x2="900" y2="600" />
  </g>

  <!-- Ambient Light Orbs -->
  <circle cx="280" cy="280" r="220" fill="#2ED8B6" opacity="0.08" filter="blur(60px)" />
  <circle cx="950" cy="220" r="200" fill="#0EA5E9" opacity="0.08" filter="blur(60px)" />

  <!-- ================= RIGHT CARD (BACKGROUND / OFFSET): MERA AI CONVERSATION ================= -->
  <g transform="translate(420, 45)" filter="url(#mCardShadow)">
    <rect x="0" y="0" width="730" height="500" rx="16" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1" />

    <!-- Top Bar -->
    <g transform="translate(24, 20)">
      <!-- Mini m: logo -->
      <text x="0" y="20" fill="#2ED8B6" font-family="system-ui, sans-serif" font-size="22" font-weight="900" font-style="italic">m:</text>
      <text x="36" y="12" fill="#64748B" font-family="system-ui, sans-serif" font-size="10" font-weight="700" letter-spacing="1">MERA AI • ATHLETE INTELLIGENCE</text>
      <text x="36" y="28" fill="#0F172A" font-family="system-ui, sans-serif" font-size="16" font-weight="800">Mera AI</text>

      <!-- Stepper: Context / Conversation / Coach Brief -->
      <g transform="translate(320, 8)" font-family="system-ui, sans-serif" font-size="11" font-weight="700">
        <rect x="0" y="0" width="70" height="24" rx="12" fill="#E2E8F0" />
        <text x="14" y="16" fill="#475569">1 Context</text>
        <rect x="80" y="0" width="105" height="24" rx="12" fill="#0D9488" />
        <text x="92" y="16" fill="#FFFFFF">2 Conversation</text>
        <rect x="195" y="0" width="85" height="24" rx="12" fill="#E2E8F0" />
        <text x="207" y="16" fill="#475569">3 Coach Brief</text>
      </g>
    </g>

    <line x1="0" y1="65" x2="730" y2="65" stroke="#E2E8F0" stroke-width="1" />

    <!-- Left Column: Sources & Chat -->
    <g transform="translate(24, 85)">
      <!-- Sources pill -->
      <rect x="0" y="0" width="180" height="60" rx="10" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1" />
      <text x="12" y="22" fill="#64748B" font-family="system-ui, sans-serif" font-size="10" font-weight="800">SOURCES (3/3)</text>
      <text x="12" y="42" fill="#0F172A" font-family="system-ui, sans-serif" font-size="11" font-weight="700">Anonymized D. L. Context</text>

      <!-- Chat Box -->
      <g transform="translate(195, 0)">
        <rect x="0" y="0" width="310" height="320" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" />
        
        <!-- User Query Bubble -->
        <g transform="translate(80, 20)">
          <rect x="0" y="0" width="215" height="32" rx="16" fill="#F1F5F9" stroke="#E2E8F0" stroke-width="1" />
          <text x="14" y="21" fill="#0F172A" font-family="system-ui, sans-serif" font-size="11" font-weight="600">How can I improve my VO₂ max?</text>
        </g>

        <!-- Mera AI Response Bubble -->
        <g transform="translate(15, 68)">
          <rect x="0" y="0" width="280" height="150" rx="12" fill="#F0FDF4" stroke="#DCFCE7" stroke-width="1" />
          <text x="12" y="20" fill="#0F172A" font-family="system-ui, sans-serif" font-size="10" font-weight="700">Mera AI Engine (Neural Threshold Analysis):</text>
          <text x="12" y="40" fill="#334155" font-family="system-ui, sans-serif" font-size="9.5" font-weight="500">
            Dmitry's current VO₂max is <tspan font-weight="800" fill="#0D9488">58.4 ml/kg/min</tspan> (+4.2% YoY).
          </text>
          <text x="12" y="58" fill="#334155" font-family="system-ui, sans-serif" font-size="9.5" font-weight="500">
            Limiter is not aerobic ceiling, but <tspan font-weight="700" fill="#E11D48">Fuel Endurance</tspan>.
          </text>
          <text x="12" y="78" fill="#334155" font-family="system-ui, sans-serif" font-size="9.5" font-weight="500">
            • Recommended: 2-3 x 12 min at FatMax (174W)
          </text>
          <text x="12" y="96" fill="#334155" font-family="system-ui, sans-serif" font-size="9.5" font-weight="500">
            • Thermal drift controlled below +1.1°C/h
          </text>
          <text x="12" y="116" fill="#334155" font-family="system-ui, sans-serif" font-size="9.5" font-weight="500">
            • Glycolytic profile readiness: 62/100
          </text>
        </g>

        <!-- Input placeholder -->
        <g transform="translate(15, 260)">
          <rect x="0" y="0" width="280" height="40" rx="20" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1" />
          <text x="16" y="24" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="11">Plan next training block...</text>
          <circle cx="255" cy="20" r="14" fill="#0D9488" />
          <path d="M 252 23 L 255 17 L 258 23" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
        </g>
      </g>

      <!-- Right Column: Coach Output -->
      <g transform="translate(520, 0)">
        <text x="0" y="14" fill="#64748B" font-family="system-ui, sans-serif" font-size="10" font-weight="800">COACH OUTPUT</text>
        <rect x="0" y="24" width="165" height="120" rx="10" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" />
        <text x="12" y="44" fill="#64748B" font-family="system-ui, sans-serif" font-size="9" font-weight="700">MAIN GOAL</text>
        <text x="12" y="60" fill="#0F172A" font-family="system-ui, sans-serif" font-size="11" font-weight="800">Ironman 70.3 • sub 4:45</text>
        <text x="12" y="80" fill="#64748B" font-family="system-ui, sans-serif" font-size="9" font-weight="700">CURRENT VOLUME</text>
        <text x="12" y="96" fill="#0F172A" font-family="system-ui, sans-serif" font-size="11" font-weight="800">6 days • 11-14 h/week</text>

        <!-- 1-Page Coach Brief Button -->
        <g transform="translate(0, 160)">
          <rect x="0" y="0" width="165" height="38" rx="10" fill="#2ED8B6" />
          <text x="16" y="23" fill="#042F2C" font-family="system-ui, sans-serif" font-size="10.5" font-weight="800">Create 1-page coach brief →</text>
        </g>
      </g>
    </g>
  </g>

  <!-- ================= LEFT CARD (FOREGROUND / PRIMARY): ATHLETE DASHBOARD ================= -->
  <g transform="translate(50, 75)" filter="url(#mCardShadow)">
    <rect x="0" y="0" width="670" height="470" rx="18" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" />

    <!-- Top Profile Bar -->
    <g transform="translate(28, 24)">
      <!-- m: logo -->
      <text x="0" y="24" fill="#2ED8B6" font-family="system-ui, sans-serif" font-size="26" font-weight="900" font-style="italic">m:</text>
      
      <g transform="translate(48, 0)">
        <text x="0" y="12" fill="#64748B" font-family="system-ui, sans-serif" font-size="9.5" font-weight="700" letter-spacing="0.5">ATHLETE DASHBOARD</text>
        <text x="0" y="32" fill="#0F172A" font-family="system-ui, sans-serif" font-size="20" font-weight="800">Dmitry Larichev</text>
        <text x="165" y="32" fill="#10B981" font-family="system-ui, sans-serif" font-size="11" font-weight="600">• 5 testten güncellendi (VO₂max &amp; Laktat)</text>
      </g>

      <!-- Target Goal Pill -->
      <g transform="translate(430, 4)">
        <rect x="0" y="0" width="150" height="32" rx="16" fill="#F1F5F9" stroke="#E2E8F0" stroke-width="1" />
        <text x="14" y="20" fill="#0F172A" font-family="system-ui, sans-serif" font-size="11" font-weight="700">Ironman 70.3 • sub 4:45</text>
      </g>
    </g>

    <line x1="0" y1="72" x2="670" y2="72" stroke="#F1F5F9" stroke-width="1" />

    <!-- Content: Radar Chart (Left) + Limiter Diagnostics (Right) -->
    <g transform="translate(28, 88)">
      
      <!-- RADAR SPIDER CHART: METABOLIC FINGERPRINT -->
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="350" height="340" rx="14" fill="#F8FAFC" stroke="#F1F5F9" stroke-width="1" />
        
        <text x="16" y="24" fill="#64748B" font-family="system-ui, sans-serif" font-size="10" font-weight="800" letter-spacing="0.5">METABOLIC FINGERPRINT</text>
        <text x="16" y="44" fill="#0F172A" font-family="system-ui, sans-serif" font-size="15" font-weight="800">Goal Readiness Analysis</text>
        
        <rect x="255" y="14" width="78" height="22" rx="11" fill="#E2E8F0" />
        <text x="264" y="29" fill="#475569" font-family="system-ui, sans-serif" font-size="9" font-weight="700">TARGET = 100</text>

        <!-- Spider Web Coordinates (Center at 175, 195) -->
        <g transform="translate(175, 200)" stroke="#CBD5E1" stroke-width="1" fill="none">
          <!-- 3 concentric polygons (7 axes) -->
          <!-- Outer 100% -->
          <polygon points="0,-100 78,-62 97,22 43,90 -43,90 -97,22 -78,-62" stroke="#94A3B8" stroke-dasharray="2 2" />
          <!-- Mid 65% -->
          <polygon points="0,-65 50,-40 63,14 28,58 -28,58 -63,14 -50,-40" stroke="#CBD5E1" />
          <!-- Inner 35% -->
          <polygon points="0,-35 27,-22 34,8 15,31 -15,31 -34,8 -27,-22" stroke="#E2E8F0" />

          <!-- Radial Spokes -->
          <line x1="0" y1="0" x2="0" y2="-100" />
          <line x1="0" y1="0" x2="78" y2="-62" />
          <line x1="0" y1="0" x2="97" y2="22" />
          <line x1="0" y1="0" x2="43" y2="90" />
          <line x1="0" y1="0" x2="-43" y2="90" />
          <line x1="0" y1="0" x2="-97" y2="22" />
          <line x1="0" y1="0" x2="-78" y2="-62" />

          <!-- Filled Athlete Shape (Cyan Teal glow) -->
          <polygon 
            points="0,-82 62,-45 78,18 25,48 -35,52 -55,10 -60,-50" 
            fill="#2ED8B6" 
            fill-opacity="0.25" 
            stroke="#0D9488" 
            stroke-width="2.5" 
          />

          <!-- Dots on Vertices -->
          <circle cx="0" cy="-82" r="3.5" fill="#0D9488" />
          <circle cx="62" cy="-45" r="3.5" fill="#0D9488" />
          <circle cx="78" cy="18" r="3.5" fill="#0D9488" />
          <circle cx="25" cy="48" r="3.5" fill="#0D9488" />
          <circle cx="-35" cy="52" r="3.5" fill="#0D9488" />
          <circle cx="-55" cy="10" r="3.5" fill="#0D9488" />
          <circle cx="-60" cy="-50" r="3.5" fill="#0D9488" />
        </g>

        <!-- Spider Axis Labels -->
        <g font-family="system-ui, sans-serif" font-size="9" font-weight="700" fill="#475569" text-anchor="middle">
          <text x="175" y="86" fill="#0F172A">Aerobic ceiling</text>
          <text x="280" y="125">Sustainable cap.</text>
          <text x="300" y="225">Economy</text>
          <text x="240" y="315">Muscle O₂ use</text>
          <text x="110" y="315">Fuel flexibility</text>
          <text x="45" y="225">Glycolytic profile</text>
          <text x="70" y="125">Thermal durability</text>
        </g>
      </g>

      <!-- LIMITERS & PHYSIOLOGICAL METRICS (RIGHT) -->
      <g transform="translate(365, 0)">
        
        <!-- Primary Limiter Card: High Impact -->
        <rect x="0" y="0" width="245" height="155" rx="12" fill="#FFF1F2" stroke="#FFE4E6" stroke-width="1.5" />
        <rect x="155" y="10" width="76" height="18" rx="9" fill="#E11D48" />
        <text x="164" y="22" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="8.5" font-weight="800">HIGH IMPACT</text>

        <text x="14" y="24" fill="#9F1239" font-family="system-ui, sans-serif" font-size="9" font-weight="800">PRIMARY LIMITER</text>
        <text x="14" y="44" fill="#0F172A" font-family="system-ui, sans-serif" font-size="15" font-weight="800">Fuel endurance</text>
        
        <text x="14" y="66" fill="#E11D48" font-family="system-ui, sans-serif" font-size="20" font-weight="900">
          62 <tspan font-size="11" font-weight="600" fill="#64748B">/ 100 readiness</tspan>
        </text>

        <g transform="translate(14, 82)" font-family="system-ui, sans-serif" font-size="10">
          <text x="0" y="12" fill="#64748B">FatMax Power:</text>
          <text x="140" y="12" fill="#0F172A" font-weight="800">174 W</text>
          
          <text x="0" y="30" fill="#64748B">CHO Crossover:</text>
          <text x="140" y="30" fill="#0F172A" font-weight="800">217 W</text>
        </g>

        <!-- Next Action Pill -->
        <rect x="14" y="122" width="217" height="22" rx="6" fill="#FFFFFF" stroke="#FECDD3" stroke-width="1" />
        <text x="22" y="137" fill="#BE123C" font-family="system-ui, sans-serif" font-size="9" font-weight="700">Open detailed intervention report →</text>


        <!-- Secondary Limiter: Thermal Durability -->
        <g transform="translate(0, 170)">
          <rect x="0" y="0" width="245" height="95" rx="12" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1" />
          <text x="14" y="20" fill="#64748B" font-family="system-ui, sans-serif" font-size="9" font-weight="800">SECONDARY METRIC</text>
          <text x="14" y="38" fill="#0F172A" font-family="system-ui, sans-serif" font-size="13" font-weight="800">Thermal durability</text>

          <g transform="translate(14, 52)" font-family="system-ui, sans-serif">
            <text x="0" y="14" fill="#0F172A" font-size="13" font-weight="800">+1.1°C/h</text>
            <text x="0" y="26" fill="#64748B" font-size="8.5">Core slope</text>

            <text x="75" y="14" fill="#0F172A" font-size="13" font-weight="800">+6.8%</text>
            <text x="75" y="26" fill="#64748B" font-size="8.5">HR drift</text>

            <text x="145" y="14" fill="#0D9488" font-size="13" font-weight="800">61%</text>
            <text x="145" y="26" fill="#64748B" font-size="8.5">Confidence</text>
          </g>
        </g>

        <!-- Bottom Accelerator Badges -->
        <g transform="translate(0, 280)">
          <rect x="0" y="0" width="245" height="55" rx="10" fill="#F0FDFA" stroke="#CCFBF1" stroke-width="1" />
          <text x="12" y="20" fill="#0F766E" font-family="system-ui, sans-serif" font-size="9.5" font-weight="800">DESTEKLEYEN PROGRAMLAR</text>
          
          <g transform="translate(12, 28)">
            <rect x="0" y="0" width="95" height="20" rx="10" fill="#0D9488" />
            <text x="10" y="14" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="9" font-weight="800">İTÜ Seed</text>

            <rect x="105" y="0" width="105" height="20" rx="10" fill="#0F172A" />
            <text x="115" y="14" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="9" font-weight="800">Innogate Global</text>
          </g>
        </g>

      </g>
    </g>
  </g>

</svg>
