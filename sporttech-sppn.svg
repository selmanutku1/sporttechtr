<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="70%" fx="50%" fy="50%">
      <stop offset="0%" stop-color="#022c22" />
      <stop offset="100%" stop-color="#02140f" />
    </radialGradient>
    
    <!-- Star Glow -->
    <filter id="blueGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Radar Lines Glow -->
    <filter id="emeraldGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)" />

  <!-- Tactical Radar Grid / Concentric Circles -->
  <g stroke="#10b981" stroke-width="1.5" stroke-opacity="0.15" fill="none">
    <circle cx="600" cy="315" r="100" />
    <circle cx="600" cy="315" r="220" />
    <circle cx="600" cy="315" r="340" />
    <circle cx="600" cy="315" r="460" />
    <circle cx="600" cy="315" r="580" />
    
    <!-- Crosshairs -->
    <line x1="600" y1="50" x2="600" y2="580" stroke-dasharray="5 5" />
    <line x1="50" y1="315" x2="1150" y2="315" stroke-dasharray="5 5" />
  </g>

  <!-- Left Side: Sporpuan Brand Group -->
  <g transform="translate(180, 240)">
    <!-- Blue Star Logo with Checkmark -->
    <g filter="url(#blueGlow)">
      <!-- Star Path -->
      <path d="M 60,0 L 78,38 L 120,44 L 88,74 L 96,116 L 60,96 L 24,116 L 32,74 L 0,44 L 42,38 Z" fill="#2563eb" />
      <!-- Rounded checkmark inside star -->
      <path d="M 45,55 L 55,67 L 78,42" fill="none" stroke="#ffffff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
    </g>
    
    <!-- Brand Text -->
    <text x="145" y="80" font-family="'Plus Jakarta Sans', 'Inter', system-ui, sans-serif" font-size="68" font-weight="bold" fill="#ffffff" letter-spacing="-1">Sporpuan</text>
  </g>

  <!-- Center Divider -->
  <line x1="630" y1="210" x2="630" y2="420" stroke="#ffffff" stroke-width="3" stroke-opacity="0.25" />

  <!-- Right Side: SportTech Türkiye Brand Group -->
  <g transform="translate(680, 240)">
    <!-- Red and Blue Concentric Arcs Badge -->
    <g transform="translate(0, 10)">
      <!-- Inner Red Arc -->
      <path d="M 40,65 A 50,50 0 1,1 90,40" fill="none" stroke="#ef4444" stroke-width="7" stroke-linecap="round" />
      <!-- Outer Blue Arc -->
      <path d="M 40,78 A 65,65 0 1,1 105,30" fill="none" stroke="#3b82f6" stroke-width="7" stroke-linecap="round" />
    </g>

    <!-- Stacked Brand Text -->
    <g transform="translate(145, 0)">
      <text x="0" y="32" font-family="'Barlow', 'Inter', system-ui, sans-serif" font-size="34" font-weight="900" fill="#ffffff" letter-spacing="1">SPORT</text>
      <text x="0" y="66" font-family="'Barlow', 'Inter', system-ui, sans-serif" font-size="34" font-weight="900" fill="#ffffff" letter-spacing="1">TECH</text>
      <text x="0" y="100" font-family="'Barlow', 'Inter', system-ui, sans-serif" font-size="34" font-weight="900" fill="#ffffff" letter-spacing="1">TÜRKİYE</text>
    </g>
  </g>

  <!-- Glowing Dots / Data Points -->
  <circle cx="340" cy="180" r="4" fill="#60a5fa" opacity="0.6" filter="url(#blueGlow)" />
  <circle cx="820" cy="460" r="5" fill="#34d399" opacity="0.6" filter="url(#emeraldGlow)" />
  <circle cx="210" cy="430" r="3" fill="#3b82f6" opacity="0.5" />
  <circle cx="940" cy="150" r="4" fill="#fbbf24" opacity="0.5" />
</svg>
