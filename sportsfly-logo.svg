<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <defs>
    <linearGradient id="sfBlueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0066FF" />
      <stop offset="100%" stop-color="#00D2FF" />
    </linearGradient>
    <linearGradient id="sfPinkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF2D85" />
      <stop offset="100%" stop-color="#FF8A00" />
    </linearGradient>
  </defs>

  <rect width="160" height="160" rx="36" fill="#FFFFFF" />

  <!-- Left Blue Teardrop/Wing -->
  <path
    d="M 68 38 
       C 80 48, 82 70, 70 86 
       C 60 98, 44 96, 40 82 
       C 36 68, 50 48, 68 38 Z"
    fill="url(#sfBlueGrad)"
  />

  <!-- Right Pink/Orange Teardrop/Wing -->
  <path
    d="M 92 122 
       C 80 112, 78 90, 90 74 
       C 100 62, 116 64, 120 78 
       C 124 92, 110 112, 92 122 Z"
    fill="url(#sfPinkGrad)"
  />

  <!-- Overlap dynamic touch -->
  <circle cx="80" cy="80" r="7" fill="#FFFFFF" opacity="0.9" />
</svg>
