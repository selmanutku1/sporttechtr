<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" width="100%" height="100%">
  <defs>
    <!-- Map Canvas & Ocean Fill -->
    <linearGradient id="oceanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D9EEF8" />
      <stop offset="100%" stop-color="#CCE5F4" />
    </linearGradient>

    <!-- Landmass Gradient -->
    <linearGradient id="landGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBF8EF" />
      <stop offset="100%" stop-color="#F4EFE0" />
    </linearGradient>

    <!-- Pin Shadows -->
    <filter id="pinShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000000" flood-opacity="0.35" />
    </filter>

    <filter id="uiShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.12" />
    </filter>
  </defs>

  <!-- Base Sea / Ocean Background -->
  <rect width="1200" height="650" rx="16" fill="url(#oceanGrad)" />

  <!-- Black Sea (Karadeniz) Area Top -->
  <path d="M 240,0 L 1200,0 L 1200,160 Q 800,140 460,180 Q 320,130 240,0 Z" fill="#C8E2F2" opacity="0.8" />

  <!-- Mediterranean & Aegean Sea (Akdeniz & Ege) -->
  <path d="M 0,300 Q 120,400 160,650 L 0,650 Z" fill="#C4E0F0" opacity="0.8" />
  <path d="M 320,650 Q 550,560 850,650 L 320,650 Z" fill="#C4E0F0" opacity="0.8" />

  <!-- Simplified Stylized Turkey Landmass Poly -->
  <path
    d="M 140,160 
       Q 220,140 340,180 
       Q 500,160 720,185 
       Q 950,195 1180,240 
       L 1180,520 
       Q 980,510 820,530 
       Q 680,560 520,530 
       Q 420,570 340,540 
       Q 260,530 180,480 
       Q 130,420 140,340 
       Q 180,310 160,250 
       Q 120,200 140,160 Z"
    fill="url(#landGrad)"
    stroke="#E2D9C5"
    stroke-width="1.5"
  />

  <!-- Thrace Region (Trakya) -->
  <path
    d="M 0,100 Q 120,110 210,170 Q 180,230 120,220 Q 30,190 0,160 Z"
    fill="url(#landGrad)"
    stroke="#E2D9C5"
    stroke-width="1.5"
  />

  <!-- Subtle Topography / Road Networks -->
  <g stroke="#E8DFCD" stroke-width="1" fill="none" opacity="0.8">
    <path d="M 220,190 Q 350,280 540,270 T 800,280 T 1100,320" />
    <path d="M 540,270 Q 420,380 380,540" />
    <path d="M 540,270 Q 600,420 700,530" />
    <path d="M 160,380 Q 300,380 540,270" />
    <path d="M 220,190 Q 200,320 160,380" />
  </g>

  <!-- City Labels -->
  <g fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" letter-spacing="0.5">
    <text x="210" y="195">İSTANBUL</text>
    <text x="230" y="270">BURSA</text>
    <text x="140" y="380">İZMİR</text>
    <text x="510" y="270">ANKARA</text>
    <text x="360" y="315">Eskişehir</text>
    <text x="495" y="470">KONYA</text>
    <text x="715" y="465">ADANA</text>
    <text x="730" y="275">Samsun</text>
    <text x="910" y="280">Trabzon</text>
    <text x="960" y="375">Erzurum</text>
    <text x="680" y="340">Sivas</text>
    <text x="880" y="445">Diyarbakır</text>
    <text x="760" y="495">Gaziantep</text>
    <text x="365" y="180">Zonguldak</text>
  </g>

  <!-- ================= SPORPUAN INTERACTIVE PINS ================= -->

  <!-- 1. İZMİR PIN: ★ 7.6 Spor (Emerald Green) -->
  <g transform="translate(135, 365)" filter="url(#pinShadow)">
    <rect x="0" y="0" width="76" height="28" rx="14" fill="#0D9488" stroke="#14B8A6" stroke-width="1.5" />
    <text x="12" y="19" fill="#FACC15" font-family="system-ui, sans-serif" font-size="12" font-weight="900">★</text>
    <text x="25" y="18" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="12" font-weight="800">7.6</text>
    <line x1="48" y1="6" x2="48" y2="22" stroke="#2DD4BF" stroke-width="1" />
    <text x="54" y="17" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="9" font-weight="700">Spor</text>
  </g>

  <!-- 2. TRAKYA / TEKİRDAĞ PIN: ★ 8.8 Spor -->
  <g transform="translate(160, 160)" filter="url(#pinShadow)">
    <rect x="0" y="0" width="76" height="28" rx="14" fill="#0D9488" stroke="#14B8A6" stroke-width="1.5" />
    <text x="12" y="19" fill="#FACC15" font-family="system-ui, sans-serif" font-size="12" font-weight="900">★</text>
    <text x="25" y="18" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="12" font-weight="800">8.8</text>
    <line x1="48" y1="6" x2="48" y2="22" stroke="#2DD4BF" stroke-width="1" />
    <text x="54" y="17" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="9" font-weight="700">Spor</text>
  </g>

  <!-- 3. İSTANBUL MULTI-PIN CLUSTER (Dense facility pins) -->
  <!-- Layer 1: Dark background pin -->
  <g transform="translate(235, 162)" opacity="0.6" filter="url(#pinShadow)">
    <rect x="0" y="0" width="82" height="28" rx="14" fill="#1E293B" />
  </g>
  <g transform="translate(245, 168)" opacity="0.8" filter="url(#pinShadow)">
    <rect x="0" y="0" width="82" height="28" rx="14" fill="#0F172A" />
  </g>

  <!-- Layer 2: Istanbul European Side ★ 9.6 Spor (Purple Pin) -->
  <g transform="translate(250, 175)" filter="url(#pinShadow)">
    <rect x="0" y="0" width="78" height="28" rx="14" fill="#7C3AED" stroke="#A78BFA" stroke-width="1.5" />
    <text x="12" y="19" fill="#FACC15" font-family="system-ui, sans-serif" font-size="12" font-weight="900">★</text>
    <text x="25" y="18" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="12" font-weight="800">9.6</text>
    <line x1="50" y1="6" x2="50" y2="22" stroke="#C4B5FD" stroke-width="1" />
    <text x="56" y="17" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="9" font-weight="700">Spor</text>
  </g>

  <!-- Layer 3: Istanbul Anatolian Side ★ 8.8 Spor (Teal Pin) -->
  <g transform="translate(295, 185)" filter="url(#pinShadow)">
    <rect x="0" y="0" width="76" height="28" rx="14" fill="#0D9488" stroke="#14B8A6" stroke-width="1.5" />
    <text x="12" y="19" fill="#FACC15" font-family="system-ui, sans-serif" font-size="12" font-weight="900">★</text>
    <text x="25" y="18" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="12" font-weight="800">8.8</text>
    <line x1="48" y1="6" x2="48" y2="22" stroke="#2DD4BF" stroke-width="1" />
    <text x="54" y="17" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="9" font-weight="700">Spor</text>
  </g>

  <!-- Layer 4: Kocaeli / Gebze Pin (Purple mini) -->
  <g transform="translate(345, 185)" filter="url(#pinShadow)">
    <rect x="0" y="0" width="46" height="24" rx="12" fill="#7C3AED" stroke="#A78BFA" stroke-width="1" />
    <text x="10" y="16" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="9" font-weight="700">Spor</text>
  </g>

  <!-- 4. ANKARA PIN: ★ 8.9 Spor (Teal/Emerald Pin) -->
  <g transform="translate(485, 250)" filter="url(#pinShadow)">
    <rect x="0" y="0" width="76" height="28" rx="14" fill="#0D9488" stroke="#14B8A6" stroke-width="1.5" />
    <text x="12" y="19" fill="#FACC15" font-family="system-ui, sans-serif" font-size="12" font-weight="900">★</text>
    <text x="25" y="18" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="12" font-weight="800">8.9</text>
    <line x1="48" y1="6" x2="48" y2="22" stroke="#2DD4BF" stroke-width="1" />
    <text x="54" y="17" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="9" font-weight="700">Spor</text>
  </g>

  <!-- 5. ANTALYA CLUSTER PIN: ★ 8.8 Spor (Amber / Orange & Green stack) -->
  <g transform="translate(350, 485)" opacity="0.6" filter="url(#pinShadow)">
    <rect x="0" y="0" width="78" height="28" rx="14" fill="#0D9488" />
  </g>
  <g transform="translate(355, 492)" filter="url(#pinShadow)">
    <rect x="0" y="0" width="78" height="28" rx="14" fill="#D97706" stroke="#FBBF24" stroke-width="1.5" />
    <text x="12" y="19" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="12" font-weight="900">★</text>
    <text x="25" y="18" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="12" font-weight="800">8.8</text>
    <line x1="50" y1="6" x2="50" y2="22" stroke="#FDE68A" stroke-width="1" />
    <text x="56" y="17" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="9" font-weight="700">Spor</text>
  </g>

  <!-- 6. ALANYA / MERSİN PIN: ★ 8.8 Spor -->
  <g transform="translate(445, 520)" filter="url(#pinShadow)">
    <rect x="0" y="0" width="76" height="28" rx="14" fill="#0D9488" stroke="#14B8A6" stroke-width="1.5" />
    <text x="12" y="19" fill="#FACC15" font-family="system-ui, sans-serif" font-size="12" font-weight="900">★</text>
    <text x="25" y="18" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="12" font-weight="800">8.8</text>
    <line x1="48" y1="6" x2="48" y2="22" stroke="#2DD4BF" stroke-width="1" />
    <text x="54" y="17" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="9" font-weight="700">Spor</text>
  </g>

  <!-- ================= TOP RIGHT APP CONTROLS ================= -->
  
  <!-- Button 1: Liste (Gizle) -->
  <g transform="translate(935, 25)" filter="url(#uiShadow)">
    <rect x="0" y="0" width="96" height="34" rx="17" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" />
    <!-- Eye icon -->
    <path d="M 16 17 Q 22 11 28 17 Q 22 23 16 17 Z" fill="none" stroke="#2563EB" stroke-width="1.5" />
    <circle cx="22" cy="17" r="2.5" fill="#2563EB" />
    <text x="34" y="21" fill="#1E293B" font-family="system-ui, sans-serif" font-size="11" font-weight="700">
      Liste (Gizle)
    </text>
  </g>

  <!-- Button 2: Küçült (Esc) -->
  <g transform="translate(1040, 25)" filter="url(#uiShadow)">
    <rect x="0" y="0" width="98" height="34" rx="17" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" />
    <!-- Shrink icon -->
    <path d="M 16 14 L 21 19 M 21 19 L 18 19 M 21 19 L 21 16" stroke="#E11D48" stroke-width="1.5" stroke-linecap="round" />
    <path d="M 28 20 L 23 15 M 23 15 L 26 15 M 23 15 L 23 18" stroke="#E11D48" stroke-width="1.5" stroke-linecap="round" />
    <text x="34" y="21" fill="#E11D48" font-family="system-ui, sans-serif" font-size="11" font-weight="700">
      Küçült (Esc)
    </text>
  </g>

  <!-- Zoom Controls (+ / -) on top right -->
  <g transform="translate(1110, 68)" filter="url(#uiShadow)">
    <rect x="0" y="0" width="28" height="28" rx="6" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" />
    <line x1="7" y1="14" x2="21" y2="14" stroke="#64748B" stroke-width="2" stroke-linecap="round" />
  </g>

  <!-- ================= BOTTOM LEFT MAP STATUS BADGE ================= -->
  <g transform="translate(20, 595)" filter="url(#uiShadow)">
    <rect x="0" y="0" width="180" height="34" rx="17" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" />
    <circle cx="16" cy="17" r="4.5" fill="#2563EB" />
    <text x="28" y="21" fill="#334155" font-family="system-ui, sans-serif" font-size="11" font-weight="500">
      Haritada <tspan font-weight="800" fill="#0F172A">116</tspan> Kayıt Listeleniyor
    </text>
  </g>

</svg>
