<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" width="100%" height="100%">
  <defs>
    <linearGradient id="oceanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC" />
      <stop offset="100%" stop-color="#F1F5F9" />
    </linearGradient>
    <filter id="pinShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.2" />
    </filter>
  </defs>

  <rect width="1200" height="650" rx="16" fill="url(#oceanGrad)" />
  
  <!-- Turkey Map Shape (Simplified) -->
  <path d="M 150,180 Q 250,150 400,190 Q 600,170 850,200 Q 1100,220 1150,260 L 1150,550 Q 950,540 750,560 Q 550,580 350,550 Q 200,530 150,480 Q 100,420 120,320 Q 100,250 150,180 Z" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2" />

  <!-- Trakya -->
  <path d="M 20,120 Q 100,130 180,180 Q 150,250 100,240 Q 50,200 20,160 Z" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2" />

