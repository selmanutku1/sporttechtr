  <g fill="#94A3B8" font-family="system-ui, sans-serif" font-size="14" font-weight="700" letter-spacing="1">
    <text x="500" y="320">TURKEY</text>
  </g>

  <!-- Pins -->
  <!-- Top Cluster (Istanbul area) -->
