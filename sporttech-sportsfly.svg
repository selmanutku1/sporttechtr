<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="70%" fx="50%" fy="50%">
      <stop offset="0%" stop-color="#022c22" />
      <stop offset="100%" stop-color="#02140f" />
    </radialGradient>
    
    <!-- SportsFly Logo Colors & Gradients -->
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#60a5fa" />
    </linearGradient>
    <linearGradient id="warmGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="50%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#facc15" />
    </linearGradient>

    <!-- Logo Glows -->
    <filter id="logoGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)" />

  <!-- Tactical Radar Grid / Concentric Circles -->
  <g stroke="#10b981" stroke-width="1.5" stroke-opacity="0.15" fill="none">
    <circle cx="600" cy="315" r="100" />
    <circle cx="600" cy="315" r="220" />
    <circle cx="600" cy="315" r="340" />
    <circle cx="600" cy="315" r="460" />
    <circle cx="600" cy="315" r="580" />
    
    <!-- Crosshairs -->
    <line x1="600" y1="50" x2="600" y2="580" stroke-dasharray="5 5" />
    <line x1="50" y1="315" x2="1150" y2="315" stroke-dasharray="5 5" />
  </g>

  <!-- Left Side: SportsFly Brand Group -->
  <g transform="translate(180, 240)">
    <!-- Brand Logo Graphic -->
    <g transform="translate(0, -10)" filter="url(#logoGlow)">
      <!-- Left Blue Wing Ribbon -->
      <path d="M 40,0 C 25,0 10,15 10,35 C 10,55 30,70 50,70 L 50,50 C 35,50 25,40 25,30 C 25,20 35,15 45,15 Z" fill="url(#blueGrad)" />
      <!-- Right Warm Wing Ribbon -->
      <path d="M 50,110 C 65,110 80,95 80,75 C 80,55 60,40 40,40 L 40,60 C 55,60 65,70 65,80 C 65,90 55,95 45,95 Z" fill="url(#warmGrad)" />
    </g>
    
    <!-- Brand Text -->
    <text x="115" y="65" font-family="'Plus Jakarta Sans', 'Inter', system-ui, sans-serif" font-size="64" font-weight="bold" fill="#ffffff" letter-spacing="-1">SportsFly</text>
  </g>

  <!-- Center Divider -->
  <line x1="630" y1="210" x2="630" y2="420" stroke="#ffffff" stroke-width="3" stroke-opacity="0.25" />

  <!-- Right Side: SportTech Türkiye Brand Group -->
  <g transform="translate(680, 240)">
    <!-- Red and Blue Concentric Arcs Badge -->
    <g transform="translate(0, 10)">
      <!-- Inner Red Arc -->
      <path d="M 40,65 A 50,50 0 1,1 90,40" fill="none" stroke="#ef4444" stroke-width="7" stroke-linecap="round" />
      <!-- Outer Blue Arc -->
      <path d="M 40,78 A 65,65 0 1,1 105,30" fill="none" stroke="#3b82f6" stroke-width="7" stroke-linecap="round" />
    </g>

    <!-- Stacked Brand Text -->
    <g transform="translate(145, 0)">
      <text x="0" y="32" font-family="'Barlow', 'Inter', system-ui, sans-serif" font-size="34" font-weight="900" fill="#ffffff" letter-spacing="1">SPORT</text>
      <text x="0" y="66" font-family="'Barlow', 'Inter', system-ui, sans-serif" font-size="34" font-weight="900" fill="#ffffff" letter-spacing="1">TECH</text>
      <text x="0" y="100" font-family="'Barlow', 'Inter', system-ui, sans-serif" font-size="34" font-weight="900" fill="#ffffff" letter-spacing="1">TÜRKİYE</text>
    </g>
  </g>

  <!-- Glowing Dots / Data Points -->
  <circle cx="340" cy="180" r="4" fill="#60a5fa" opacity="0.6" filter="url(#logoGlow)" />
  <circle cx="820" cy="460" r="5" fill="#34d399" opacity="0.6" />
  <circle cx="210" cy="430" r="3" fill="#3b82f6" opacity="0.5" />
  <circle cx="940" cy="150" r="4" fill="#fbbf24" opacity="0.5" />
</svg>
