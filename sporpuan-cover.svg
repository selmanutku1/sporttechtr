<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="spBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EFF6FF" />
      <stop offset="50%" stop-color="#F8FAFC" />
      <stop offset="100%" stop-color="#EEF2FF" />
    </linearGradient>

    <!-- Blue text & button gradient -->
    <linearGradient id="spBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>

    <!-- Card Soft Shadow -->
    <filter id="spCardShadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#0F172A" flood-opacity="0.1" />
    </filter>

    <filter id="spBadgeShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#0F172A" flood-opacity="0.06" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="1200" height="500" rx="20" fill="url(#spBgGrad)" />

  <!-- Background Gym Bokeh / Subtle Equipment Silhouettes -->
  <g opacity="0.08" fill="#1E293B">
    <!-- Dumbbell shapes in background -->
    <rect x="600" y="80" width="120" height="24" rx="12" transform="rotate(-25 600 80)" />
    <rect x="580" y="50" width="30" height="80" rx="15" transform="rotate(-25 600 80)" />
    <rect x="690" y="50" width="30" height="80" rx="15" transform="rotate(-25 600 80)" />

    <rect x="450" y="240" width="160" height="30" rx="15" transform="rotate(35 450 240)" />
    <rect x="420" y="200" width="40" height="110" rx="20" transform="rotate(35 450 240)" />
    <rect x="570" y="200" width="40" height="110" rx="20" transform="rotate(35 450 240)" />
  </g>

  <!-- Ambient Sparkles -->
  <g fill="#3B82F6" opacity="0.4">
    <!-- Sparkle 1 Top Right -->
    <path d="M 880 50 Q 880 65 895 65 Q 880 65 880 80 Q 880 65 865 65 Q 880 65 880 50 Z" />
    <circle cx="895" cy="50" r="2.5" />
    <!-- Sparkle 2 Bottom Right -->
    <path d="M 1100 340 Q 1100 350 1110 350 Q 1100 350 1100 360 Q 1100 350 1090 350 Q 1100 350 1100 340 Z" fill="#F59E0B" opacity="0.6" />
  </g>

  <!-- ================= LEFT CONTENT AREA ================= -->
  
  <!-- 1. Top Verification Pill Badge -->
  <g transform="translate(60, 40)">
    <rect x="0" y="0" width="245" height="34" rx="17" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="1" />
    <!-- Shield Check Icon -->
    <circle cx="20" cy="17" r="9" fill="#DBEAFE" />
    <path d="M 16 17 L 19 20 L 25 14" fill="none" stroke="#2563EB" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
    <text x="36" y="22" fill="#1D4ED8" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700">
      Türkiye'nin Spor Değerlendirme Platformu
    </text>
  </g>

  <!-- 2. Hero Headline -->
  <g transform="translate(60, 130)">
    <!-- Line 1: Blue Gradient -->
    <text x="0" y="0" fill="#2563EB" font-family="system-ui, -apple-system, sans-serif" font-size="44" font-weight="900" letter-spacing="-0.5">
      Spor Tesislerini
    </text>
    <!-- Line 2: Dark Slate -->
    <text x="0" y="52" fill="#0F172A" font-family="system-ui, -apple-system, sans-serif" font-size="46" font-weight="900" letter-spacing="-1">
      Puanla, Yorumla, Keşfet!
    </text>
  </g>

  <!-- 3. Subtitle Description -->
  <g transform="translate(60, 240)">
    <text x="0" y="0" fill="#1E293B" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="400">
      <tspan font-weight="800" fill="#1D4ED8">Sporpuan</tspan> ile spor tesislerini, spor okullarını ve etkinlikleri gerçek kullanıcı
    </text>
    <text x="0" y="24" fill="#334155" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="400">
      deneyimleriyle şeffafça inceleyin, puanlayın ve size en uygununu keşfedin.
    </text>
  </g>

  <!-- 4. Interactive Search Bar Container -->
  <g transform="translate(60, 310)">
    <!-- Outer Search Input Box -->
    <rect x="0" y="0" width="580" height="56" rx="28" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" filter="url(#spBadgeShadow)" />
    
    <!-- Search Icon -->
    <circle cx="28" cy="28" r="7" fill="none" stroke="#64748B" stroke-width="2" />
    <line x1="33" y1="33" x2="40" y2="40" stroke="#64748B" stroke-width="2" stroke-linecap="round" />

    <!-- Placeholder Text -->
    <text x="52" y="34" fill="#64748B" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="500">
      Tesis, salon, spor okulu veya etkinlik ara...
    </text>

    <!-- Search Button (Right Pill) -->
    <g transform="translate(435, 6)">
      <rect x="0" y="0" width="138" height="44" rx="22" fill="url(#spBlue)" />
      <!-- Small Search Icon inside Button -->
      <circle cx="24" cy="22" r="5" fill="none" stroke="#FFFFFF" stroke-width="1.8" />
      <line x1="28" y1="26" x2="33" y2="31" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" />
      <text x="40" y="27" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="800">
        Ara &amp; Keşfet
      </text>
    </g>
  </g>

  <!-- 5. Quick Action Tags / Buttons Below Search -->
  <g transform="translate(60, 395)">
    <!-- Button 1: Puanla & Yorum Yaz (Blue Tint) -->
    <rect x="0" y="0" width="165" height="44" rx="14" fill="#DBEAFE" stroke="#BFDBFE" stroke-width="1" />
    <!-- Blue Star Icon -->
    <path d="M 22 14 L 25 21 L 32 21 L 26 25 L 28 32 L 22 28 L 16 32 L 18 25 L 12 21 L 19 21 Z" fill="#2563EB" />
    <text x="38" y="27" fill="#1D4ED8" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">
      Puanla &amp; Yorum Yaz
    </text>

    <!-- Button 2: Haritada Gör (Green/White Tint) -->
    <g transform="translate(180, 0)">
      <rect x="0" y="0" width="140" height="44" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" />
      <!-- Location Pin Icon -->
      <circle cx="22" cy="20" r="5" fill="none" stroke="#059669" stroke-width="2" />
      <path d="M 22 25 L 22 28" stroke="#059669" stroke-width="2" stroke-linecap="round" />
      <text x="36" y="27" fill="#0F172A" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">
        Haritada Gör
      </text>
    </g>
  </g>


  <!-- ================= RIGHT FLOATING CARDS AREA ================= -->

  <!-- Top Floating Location Pill: Kadıköy, İst -->
  <g transform="translate(930, 65)">
    <rect x="0" y="0" width="145" height="58" rx="18" fill="#FFFFFF" filter="url(#spBadgeShadow)" stroke="#F1F5F9" stroke-width="1" />
    <!-- Pin Icon in soft rose circle -->
    <circle cx="28" cy="29" r="14" fill="#FEE2E2" />
    <circle cx="28" cy="27" r="4" fill="none" stroke="#E11D48" stroke-width="2" />
    <path d="M 28 31 L 28 35" stroke="#E11D48" stroke-width="2" stroke-linecap="round" />
    <text x="50" y="24" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700">
      Konum
    </text>
    <text x="50" y="42" fill="#0F172A" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="800">
      Kadıköy, İst
    </text>
  </g>

  <!-- MAIN REVIEW CARD: Merkez Spor Kompleksi -->
  <g transform="translate(800, 135)" filter="url(#spCardShadow)">
    <rect x="0" y="0" width="270" height="215" rx="24" fill="#FFFFFF" />

    <!-- Trophy / Badge Icon -->
    <rect x="18" y="20" width="40" height="40" rx="12" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="1" />
    <!-- Trophy Icon -->
    <path d="M 32 30 L 44 30 L 42 42 C 42 46 34 46 34 42 Z" fill="none" stroke="#2563EB" stroke-width="2" />
    <path d="M 30 32 C 26 32 26 38 32 38" fill="none" stroke="#2563EB" stroke-width="1.5" />
    <path d="M 46 32 C 50 32 50 38 44 38" fill="none" stroke="#2563EB" stroke-width="1.5" />
    <line x1="38" y1="46" x2="38" y2="52" stroke="#2563EB" stroke-width="2" />
    <line x1="32" y1="52" x2="44" y2="52" stroke="#2563EB" stroke-width="2" stroke-linecap="round" />

    <!-- Facility Name & Stars -->
    <text x="68" y="34" fill="#0F172A" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="800">
      Merkez Spor Kompleksi
    </text>
    
    <!-- 5 Gold Stars -->
    <g transform="translate(68, 42)" fill="#F59E0B">
      <path d="M 5 0 L 6.5 4.5 L 11 4.5 L 7.5 7 L 9 11.5 L 5 8.5 L 1 11.5 L 2.5 7 L -1 4.5 L 3.5 4.5 Z" />
      <path d="M 19 0 L 20.5 4.5 L 25 4.5 L 21.5 7 L 23 11.5 L 19 8.5 L 15 11.5 L 16.5 7 L 13 4.5 L 17.5 4.5 Z" />
      <path d="M 33 0 L 34.5 4.5 L 39 4.5 L 35.5 7 L 37 11.5 L 33 8.5 L 29 11.5 L 30.5 7 L 27 4.5 L 31.5 4.5 Z" />
      <path d="M 47 0 L 48.5 4.5 L 53 4.5 L 49.5 7 L 51 11.5 L 47 8.5 L 43 11.5 L 44.5 7 L 41 4.5 L 45.5 4.5 Z" />
      <path d="M 61 0 L 62.5 4.5 L 67 4.5 L 63.5 7 L 65 11.5 L 61 8.5 L 57 11.5 L 58.5 7 L 55 4.5 L 59.5 4.5 Z" />
      <text x="76" y="10" fill="#0F172A" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700">5.0</text>
    </g>

    <!-- Progress Rating Bar 1: Blue (Ekipman & Modernlik) -->
    <g transform="translate(20, 85)">
      <circle cx="4" cy="4" r="3" fill="#2563EB" />
      <rect x="14" y="0" width="215" height="7" rx="3.5" fill="#F1F5F9" />
      <rect x="14" y="0" width="200" height="7" rx="3.5" fill="#2563EB" />
    </g>

    <!-- Progress Rating Bar 2: Green (Hijyen & Temizlik) -->
    <g transform="translate(20, 105)">
      <circle cx="4" cy="4" r="3" fill="#10B981" />
      <rect x="14" y="0" width="215" height="7" rx="3.5" fill="#F1F5F9" />
      <rect x="14" y="0" width="210" height="7" rx="3.5" fill="#10B981" />
    </g>

    <!-- Progress Rating Bar 3: Orange (Eğitmen & Hizmet) -->
    <g transform="translate(20, 125)">
      <circle cx="4" cy="4" r="3" fill="#F97316" />
      <rect x="14" y="0" width="215" height="7" rx="3.5" fill="#F1F5F9" />
      <rect x="14" y="0" width="185" height="7" rx="3.5" fill="#F97316" />
    </g>

    <!-- Divider Line -->
    <line x1="20" y1="155" x2="250" y2="155" stroke="#F1F5F9" stroke-width="1.5" />

    <!-- Bottom Check: Güvenilir Tesis Puanlaması -->
    <g transform="translate(20, 175)">
      <circle cx="9" cy="9" r="8" fill="#ECFDF5" />
      <path d="M 6 9 L 8 11 L 13 6" fill="none" stroke="#10B981" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
      <text x="24" y="13" fill="#047857" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700">
        Güvenilir Tesis Puanlaması
      </text>
    </g>
  </g>

  <!-- Bottom Floating Score Badge: Harika (9.2) -->
  <g transform="translate(775, 345)" filter="url(#spBadgeShadow)">
    <rect x="0" y="0" width="145" height="60" rx="18" fill="#FFFFFF" stroke="#F1F5F9" stroke-width="1" />
    
    <!-- Pulse Line Icon in Lavender Circle -->
    <circle cx="28" cy="30" r="14" fill="#EEF2FF" />
    <path d="M 20 30 L 25 30 L 27 24 L 30 36 L 33 30 L 36 30" fill="none" stroke="#4F46E5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />

    <text x="50" y="24" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700">
      Tesis Puanı
    </text>
    <text x="50" y="44" fill="#0F172A" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="800">
      Harika <tspan fill="#2563EB">(9.2)</tspan>
    </text>
  </g>

</svg>
